name: build

permissions:
  contents: write # release publish; the token is not persisted to disk for the npm/test steps (see checkout)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build and publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm version 1.0.${{ github.run_number }} --no-git-tag-version
          gh release create v1.0.${{ github.run_number }} --draft --title 1.0.${{ github.run_number }} --target ${{ github.sha }} --notes "" --repo ${{ github.repository }}
          npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder uploads assets in parallel and each upload creates the release
      # if it can't find one (422 / duplicate drafts). The draft is created up front
      # above, so all uploads land in it; this step publishes it.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: gh release edit v1.0.${{ github.run_number }} --draft=false --latest --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer
        if: github.event_name == 'pull_request'
        run: npx electron-builder --win --publish never

      - name: Upload installer
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardImageSaver-Setup
          path: dist/*.exe
